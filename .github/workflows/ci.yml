name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml reutiliza este workflow: una release solo sale con CI en verde.
  workflow_call:

permissions:
  contents: read

concurrency:
  # En PRs, un push nuevo cancela el run anterior; en main/tags cada run se conserva.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows tests and service host build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Build service host
        run: dotnet build service_host\YarbisServiceHost.csproj

  linux:
    name: Linux tests (core multiplataforma)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        # win11toast queda excluido por el marcador sys_platform; las notificaciones
        # de escritorio en Linux salen por notify-send (notifications.py).
        run: python -m pip install -r requirements.txt

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Python tests
        # Los modulos de test que dependen de tkinter/SCM de Windows se auto-omiten
        # (raise unittest.SkipTest) fuera de win32; el resto de la suite corre igual.
        run: python -m unittest discover -s tests
