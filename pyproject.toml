[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yarbis"
version = "0.1.0"
description = "Agente local Windows-first con Ollama, memoria persistente y herramientas seguras."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama==0.6.1",
  "win11toast==0.36.3",
  "playwright>=1.45,<2",
  "pystray>=0.19",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".git",
  ".venv",
  ".yarbis_runtime",
  "__pycache__",
  "tests_runtime",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"yarbis_service.py" = ["E402"]

[tool.setuptools]
py-modules = [
  "activity",
  "agent",
  "browser_automation",
  "credential_store",
  "integrations",
  "intent_text",
  "internet",
  "main",
  "memory",
  "memory_backup",
  "memory_transfer",
  "notifications",
  "pc_context",
  "pc_context_runtime",
  "pc_context_tray",
  "pc_context_worker",
  "power",
  "proactive_context",
  "secrets_redaction",
  "self_knowledge",
  "service_manager",
  "session",
  "telegram_format",
  "telegram_inbox",
  "social_oauth",
  "social_publishing",
  "tools",
  "ui_dialogs",
  "ui_settings_dialogs",
  "ui_theme",
  "yarbis_desktop",
  "yarbis_service",
]
