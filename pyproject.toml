[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yarbis"
version = "0.1.0"
description = "Agente local Windows-first con Ollama, memoria persistente y herramientas seguras."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama==0.6.1",
  # win11toast solo existe en Windows; en Linux/macOS se usa notify-send/osascript.
  "win11toast==0.36.3; sys_platform == 'win32'",
  "playwright>=1.45,<2",
  "pystray>=0.19",
  "Pillow>=10",
  "faster-whisper>=1.1,<2",
  "pyttsx3>=2.99,<3",
  "sounddevice>=0.5,<1",
  "imageio-ffmpeg>=0.6,<1",
  "ttkbootstrap>=1.20,<2",
  "textual>=1,<2",
  "keyring>=24,<26",
  "edge-tts>=7,<8",
  "tzdata>=2024.1",
  "pyautogui>=0.9.54,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".git",
  ".venv",
  ".yarbis_runtime",
  "__pycache__",
  "tests_runtime",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"pc_context_tray.py" = ["E402"]
"yarbis_desktop.py" = ["E402"]
"yarbis_service.py" = ["E402"]
"yarbis_tui.py" = ["E402"]

[tool.setuptools]
py-modules = [
  "activity",
  "agent",
  "browser_automation",
  "credential_store",
  "conversation_ux",
  "device_profile",
  "integrations",
  "intent_text",
  "internet",
  "main",
  "memory",
  "memory_backup",
  "memory_transfer",
  "mesh",
  "mesh_relay",
  "native_service",
  "notifications",
  "pc_context",
  "pc_context_runtime",
  "pc_context_tray",
  "pc_context_worker",
  "power",
  "proactive_context",
  "secrets_redaction",
  "self_knowledge",
  "service_manager",
  "session",
  "telegram_format",
  "telegram_inbox",
  "social_oauth",
  "social_publishing",
  "tools",
  "ui_dialogs",
  "ui_settings_dialogs",
  "ui_theme",
  "voice",
  "voice_conversation",
  "yarbis_bus",
  "yarbis_desktop",
  "yarbis_instance",
  "yarbis_mobile",
  "yarbis_node",
  "yarbis_service",
]
